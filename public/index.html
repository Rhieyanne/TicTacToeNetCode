<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <p id="state-label"></p>

    <!-- LOGIN -->
    <div id="login-screen" class="screen">
        <input id="username-input" placeholder="Username">
        <input id="password-input" type="password" placeholder="Password">
        <div>
            <button id="login-button">Login</button>
            <button id="create-button">Create account</button>
        </div>
        <p id="login-message"></p>
    </div>

    <!-- LOBBY -->
    <div id="lobby-screen" class="screen">
        <h2 id="welcome-text"></h2>
        <p>Type a room name. If it doesn't exist yet, it will be made for you.</p>
        <input id="room-input" placeholder="Room name">
        <button id="join-button">Join / Create room</button>
        <p id="lobby-message"></p>
    </div>

    <!-- WAITING -->
    <div id="waiting-screen" class="screen">
        <h2 id="waiting-text"></h2>
        <p>Waiting for an opponent to join...</p>
        <button id="waiting-back-button">Back</button>
    </div>

    <!-- PLAYING -->
    <div id="playing-screen" class="screen">
        <p id="match-text"></p>
        <p id="game-status"></p>

        <div id="board">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <div>
            <button id="rematch-button">Play again</button>
            <button id="playing-back-button">Leave match</button>
        </div>
    </div>

    <!-- this file comes from the server automatically -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
